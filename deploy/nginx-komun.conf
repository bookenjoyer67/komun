# Komun reverse proxy (nginx) — starting point.
#
# Komun does not terminate TLS itself; run this behind a TLS listener (certbot / your proxy)
# Add the ssl_certificate lines and `listen 443 ssl;` for production.
#
# There is no relay and no WebSocket route to proxy — the server is plain HTTP + JSON.

server {
    listen 80;
    server_name komun.example.org;

    # Must not be below the server's largest upload body: [media] max_post_images x
    # max_post_image_bytes + 64 KiB (5 x 5 MiB + 64 KiB with the defaults). nginx refuses a
    # larger body itself, before the server's own per-route limit can answer.
    client_max_body_size 26m;
    # A client that stops sending its body is cut off here; the server answers 408 after 30 s
    # (120 s on the two upload routes) whatever this is set to.
    client_body_timeout 30s;

    # API, avatars and post images all live on the Rust server (default :3000).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Above the server's longest request timeout (120 s on an upload), so the server's 408
        # reaches the client instead of an nginx 504.
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location /avatars/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location /post-images/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # SvelteKit static build (adapter-static) with an SPA fallback.
    location / {
        root /opt/komun/frontend;
        try_files $uri $uri/ /index.html;
    }
}
