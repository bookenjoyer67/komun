<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#24466b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <text x="60" y="44" font-size="30" font-weight="700" fill="#1b1f24">Komun pre-merge quality gate - workflow, memory and the container boundary</text>
  <text x="60" y="1058" font-size="18" fill="#1b1f24">Source of record: agentic.config.json (keys: gates, roles, toolchain.commands) - grant map: docs/routing-and-tool-grant-map.json - boundary and mounts: scripts/run-agent.sh.</text>

  <rect x="60" y="150" width="1420" height="750" rx="16" fill="#fbfcfe" stroke="#24466b" stroke-width="3" stroke-dasharray="14 9"/>
  <text x="64" y="142" font-size="18" font-weight="700" fill="#24466b">AGENT CONTAINER - agent-sandbox:komun-m3 - runs as root</text>

  <rect x="380" y="58" width="780" height="64" rx="8" fill="#faeedd" stroke="#a96200" stroke-width="2"/>
  <text x="770" y="85" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1f24">Human operator (engineer)</text>
  <text x="770" y="107" text-anchor="middle" font-size="18" fill="#1b1f24">files the change request - approves the plan at checkpoint 1 - approves release at checkpoint 2</text>

  <line x1="770" y1="122" x2="770" y2="166" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>
  <text x="782" y="142" font-size="18" font-weight="700" fill="#24466b">[B1] change request</text>

  <rect x="510" y="170" width="520" height="64" rx="8" fill="#e7eef6" stroke="#24466b" stroke-width="2"/>
  <text x="770" y="197" text-anchor="middle" font-size="21" font-weight="700" fill="#1b1f24">Orchestrator</text>
  <text x="770" y="219" text-anchor="middle" font-size="18" fill="#1b1f24">sequences the roles; decides loop, skip, halt, escalate; 0 MCP grants</text>

  <line x1="770" y1="234" x2="770" y2="256" stroke="#24466b" stroke-width="2"/>
  <line x1="140" y1="256" x2="1400" y2="256" stroke="#24466b" stroke-width="2"/>
  <line x1="230" y1="256" x2="230" y2="278" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="446" y1="256" x2="446" y2="278" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="662" y1="256" x2="662" y2="278" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="878" y1="256" x2="878" y2="278" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="1094" y1="256" x2="1094" y2="278" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="1310" y1="256" x2="1310" y2="278" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>
  <text x="145" y="248" font-size="18" fill="#24466b">invokes each role and evaluates each return</text>

  <rect x="140" y="278" width="180" height="80" rx="8" fill="#f2f4f7" stroke="#b9c1cb" stroke-width="2"/>
  <text x="230" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">Planner</text>
  <text x="230" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#2f7d6b">6 tools</text>

  <rect x="356" y="278" width="180" height="80" rx="8" fill="#f2f4f7" stroke="#b9c1cb" stroke-width="2"/>
  <text x="446" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">Implementer</text>
  <text x="446" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#2f7d6b">9 tools</text>

  <rect x="572" y="278" width="180" height="80" rx="8" fill="#f2f4f7" stroke="#b9c1cb" stroke-width="2"/>
  <text x="662" y="304" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">Tester</text>
  <text x="662" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#2f7d6b">7 tools</text>
  <text x="662" y="348" text-anchor="middle" font-size="18" fill="#1b1f24">holds run_gate</text>

  <rect x="788" y="278" width="180" height="80" rx="8" fill="#f2f4f7" stroke="#b9c1cb" stroke-width="2"/>
  <text x="878" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">Reviewer</text>
  <text x="878" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#2f7d6b">8 tools</text>

  <rect x="1004" y="278" width="180" height="80" rx="8" fill="#f2f4f7" stroke="#b9c1cb" stroke-width="2"/>
  <text x="1094" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">Project-manager</text>
  <text x="1094" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#2f7d6b">3 tools</text>

  <rect x="1220" y="278" width="180" height="80" rx="8" fill="#f2f4f7" stroke="#b9c1cb" stroke-width="2"/>
  <text x="1310" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">Researcher</text>
  <text x="1310" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#2f7d6b">2 tools</text>

  <path d="M140,374 V382 H320 V374" fill="none" stroke="#2f7d6b" stroke-width="1.5"/>
  <text x="230" y="400" text-anchor="middle" font-size="18" fill="#2f7d6b">Plan</text>
  <path d="M356,374 V382 H536 V374" fill="none" stroke="#2f7d6b" stroke-width="1.5"/>
  <text x="446" y="400" text-anchor="middle" font-size="18" fill="#2f7d6b">Build</text>
  <path d="M572,374 V382 H968 V374" fill="none" stroke="#2f7d6b" stroke-width="1.5"/>
  <text x="770" y="400" text-anchor="middle" font-size="18" fill="#2f7d6b">Verify</text>
  <path d="M1004,374 V382 H1184 V374" fill="none" stroke="#2f7d6b" stroke-width="1.5"/>
  <text x="1094" y="400" text-anchor="middle" font-size="18" fill="#2f7d6b">Coordinate</text>
  <path d="M1220,374 V382 H1400 V374" fill="none" stroke="#2f7d6b" stroke-width="1.5"/>
  <text x="1310" y="400" text-anchor="middle" font-size="18" fill="#2f7d6b">External</text>

  <line x1="1202" y1="408" x2="1202" y2="432" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>
  <text x="1214" y="426" font-size="18" fill="#24466b">per-tool grants at call time</text>

  <line x1="170" y1="436" x2="1390" y2="436" stroke="#24466b" stroke-width="4"/>
  <text x="170" y="426" font-size="18" font-weight="700" fill="#24466b">MCP bus - the four MCP servers</text>
  <line x1="300" y1="436" x2="300" y2="460" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="620" y1="436" x2="620" y2="460" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="940" y1="436" x2="940" y2="460" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="1260" y1="436" x2="1260" y2="460" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="170" y="464" width="260" height="78" rx="8" fill="#e2f0eb" stroke="#2f7d6b" stroke-width="2"/>
  <text x="300" y="490" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">gate</text>
  <text x="300" y="512" text-anchor="middle" font-size="18" fill="#1b1f24">8 allowlisted gate commands</text>
  <text x="300" y="532" text-anchor="middle" font-size="18" fill="#2f7d6b">run_gate: tester alone</text>

  <rect x="470" y="464" width="300" height="78" rx="8" fill="#e2f0eb" stroke="#2f7d6b" stroke-width="2"/>
  <text x="620" y="490" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">storage</text>
  <text x="620" y="512" text-anchor="middle" font-size="18" fill="#1b1f24">entry reads, writes, journals</text>
  <text x="620" y="532" text-anchor="middle" font-size="18" fill="#2f7d6b">update_entry: implementer alone</text>

  <rect x="810" y="464" width="260" height="78" rx="8" fill="#e2f0eb" stroke="#2f7d6b" stroke-width="2"/>
  <text x="940" y="490" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">retrieval</text>
  <text x="940" y="512" text-anchor="middle" font-size="18" fill="#1b1f24">read-only, project-scoped</text>
  <text x="940" y="532" text-anchor="middle" font-size="18" fill="#2f7d6b">ceiling pinned per role</text>

  <rect x="1130" y="464" width="260" height="78" rx="8" fill="#e2f0eb" stroke="#2f7d6b" stroke-width="2"/>
  <text x="1260" y="490" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">coursetools</text>
  <text x="1260" y="512" text-anchor="middle" font-size="18" fill="#1b1f24">file, search, task, web tools</text>
  <text x="1260" y="532" text-anchor="middle" font-size="18" fill="#2f7d6b">web_search: researcher alone</text>

  <line x1="616" y1="542" x2="616" y2="576" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="947" y1="542" x2="947" y2="576" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>
  <text x="628" y="566" font-size="18" fill="#24466b">reads and writes</text>

  <rect x="134" y="580" width="290" height="88" rx="8" fill="#e7eef6" stroke="#24466b" stroke-width="2"/>
  <text x="279" y="608" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">memory: project</text>
  <text x="279" y="630" text-anchor="middle" font-size="18" fill="#1b1f24">Layer 1 - agent-writable</text>
  <text x="279" y="652" text-anchor="middle" font-size="18" fill="#1b1f24">entries, project-scoped</text>

  <rect x="468" y="580" width="290" height="88" rx="8" fill="#e7eef6" stroke="#24466b" stroke-width="2"/>
  <text x="613" y="608" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">memory: knowledge</text>
  <text x="613" y="630" text-anchor="middle" font-size="18" fill="#1b1f24">Layer 2 - read-only</text>
  <text x="613" y="652" text-anchor="middle" font-size="18" fill="#1b1f24">chmod 444</text>

  <rect x="802" y="580" width="290" height="88" rx="8" fill="#e7eef6" stroke="#24466b" stroke-width="2"/>
  <text x="947" y="608" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">memory: reference</text>
  <text x="947" y="630" text-anchor="middle" font-size="18" fill="#1b1f24">Layer 3 - indexed</text>
  <text x="947" y="652" text-anchor="middle" font-size="18" fill="#1b1f24">read-only</text>

  <rect x="1136" y="580" width="290" height="88" rx="8" fill="#e7eef6" stroke="#24466b" stroke-width="2"/>
  <text x="1281" y="608" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">gate journals</text>
  <text x="1281" y="630" text-anchor="middle" font-size="18" fill="#1b1f24">storage, retrieval, gate</text>
  <text x="1281" y="652" text-anchor="middle" font-size="18" fill="#1b1f24">audit logs - read-only binds</text>

  <rect x="110" y="706" width="640" height="76" rx="8" fill="#f2f4f7" stroke="#b9c1cb" stroke-width="2"/>
  <text x="130" y="734" font-size="18" font-weight="700" fill="#1b1f24">networks</text>
  <text x="130" y="756" font-size="18" fill="#1b1f24">agent-internal (docker --internal): MCP loopback, no egress</text>
  <text x="130" y="776" font-size="18" fill="#1b1f24">agent-net: reaches the credential broker only</text>

  <rect x="800" y="706" width="700" height="96" rx="8" fill="#faeedd" stroke="#a96200" stroke-width="2"/>
  <text x="820" y="734" font-size="18" font-weight="700" fill="#1b1f24">inside the container</text>
  <text x="820" y="756" font-size="18" fill="#1b1f24">holds only a dummy token:</text>
  <text x="820" y="776" font-size="18" fill="#1b1f24">ANTHROPIC_AUTH_TOKEN=sandbox-dummy-token</text>
  <text x="820" y="796" font-size="18" fill="#1b1f24">no key material and no secret mounts</text>

  <text x="110" y="818" font-size="18" fill="#1b1f24">The container runs as root, so the mount is the enforcement, not a permission bit: seven nested read-only binds cover the four grant files and the three journals (the P7 and P10 fix).</text>
  <text x="110" y="842" font-size="18" fill="#1b1f24">The repository is bind-mounted at /workspace: read-write for the orchestrator and the implementer, read-only for the other five roles.</text>

  <line x1="1480" y1="455" x2="1536" y2="455" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>
  <text x="1460" y="447" text-anchor="end" font-size="18" font-weight="700" fill="#24466b">[B2]</text>
  <line x1="1480" y1="700" x2="1536" y2="700" stroke="#24466b" stroke-width="2" marker-end="url(#ab)"/>
  <text x="1460" y="692" text-anchor="end" font-size="18" font-weight="700" fill="#24466b">[B3]</text>

  <rect x="1540" y="400" width="350" height="110" rx="8" fill="#faeedd" stroke="#a96200" stroke-width="2"/>
  <text x="1715" y="432" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">credential broker</text>
  <text x="1715" y="456" text-anchor="middle" font-size="18" fill="#1b1f24">rev-broker:4000 on agent-net</text>
  <text x="1715" y="478" text-anchor="middle" font-size="18" fill="#1b1f24">holds the key material</text>
  <text x="1715" y="500" text-anchor="middle" font-size="18" fill="#1b1f24">the container never sees it</text>

  <text x="1540" y="576" font-size="18" font-weight="700" fill="#1b1f24">CI - 5 jobs (3 gating, 2 advisory)</text>

  <rect x="1540" y="596" width="350" height="62" rx="8" fill="#f2f4f7" stroke="#b9c1cb" stroke-width="2"/>
  <text x="1560" y="622" font-size="18" font-weight="700" fill="#1b1f24">change-type-check</text>
  <text x="1870" y="622" text-anchor="end" font-size="18" fill="#a96200">gating</text>

  <rect x="1540" y="668" width="350" height="62" rx="8" fill="#f2f4f7" stroke="#b9c1cb" stroke-width="2"/>
  <text x="1560" y="694" font-size="18" font-weight="700" fill="#1b1f24">policy-gate</text>
  <text x="1870" y="694" text-anchor="end" font-size="18" fill="#a96200">gating</text>

  <rect x="1540" y="740" width="350" height="62" rx="8" fill="#f2f4f7" stroke="#b9c1cb" stroke-width="2"/>
  <text x="1560" y="766" font-size="18" font-weight="700" fill="#1b1f24">eval-gate</text>
  <text x="1870" y="766" text-anchor="end" font-size="18" fill="#a96200">gating</text>

  <rect x="1540" y="812" width="350" height="62" rx="8" fill="#f2f4f7" stroke="#b9c1cb" stroke-width="2"/>
  <text x="1560" y="838" font-size="18" font-weight="700" fill="#1b1f24">advisory-review</text>
  <text x="1870" y="838" text-anchor="end" font-size="18" fill="#5a6472">advisory</text>

  <rect x="1540" y="884" width="350" height="62" rx="8" fill="#f2f4f7" stroke="#b9c1cb" stroke-width="2"/>
  <text x="1560" y="910" font-size="18" font-weight="700" fill="#1b1f24">audit-trail</text>
  <text x="1870" y="910" text-anchor="end" font-size="18" fill="#5a6472">advisory</text>

  <text x="64" y="1000" font-size="18" fill="#1b1f24">B1, B2 and B3 cross the container boundary: the human's request in (B1), the broker's key material in (B2), the merged change and its gate evidence out (B3).</text>
</svg>
