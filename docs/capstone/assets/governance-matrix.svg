<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <text x="150" y="52" font-size="30" font-weight="700" fill="#1b1f24">Least privilege by role and server - Komun pre-merge quality gate</text>

  <rect x="150" y="84" width="34" height="24" fill="#e2f0eb" stroke="#2f7d6b" stroke-width="2"/>
  <text x="196" y="102" font-size="16" fill="#1b1f24">filled cell: the role holds at least one grant on that server; the label gives the count of granted tools</text>

  <rect x="150" y="116" width="34" height="24" fill="#ffffff" stroke="#b9c1cb" stroke-width="2"/>
  <text x="196" y="134" font-size="16" fill="#1b1f24">empty cell: no grant at all on that server (left visibly blank)</text>

  <rect x="150" y="148" width="34" height="24" fill="#e7eef6" stroke="#24466b" stroke-width="2"/>
  <text x="196" y="166" font-size="16" fill="#1b1f24">retrieval ceiling column: the pinned classification level (internal or none) - not a grant</text>

  <rect x="150" y="180" width="34" height="24" fill="#f2f4f7" stroke="#b9c1cb" stroke-width="2"/>
  <text x="196" y="198" font-size="16" fill="#1b1f24">workspace mount column: the mount mode for the role, from agentic.config.json roles.mounts</text>

