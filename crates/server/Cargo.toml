[package]
name = "komun-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
komun-core = { path = "../core" }
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
dotenvy = "0.15"
anyhow = "1"
rand = "0.8"
base64 = "0.22"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
# The three formats the upload routes accept and no other decoder.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
argon2 = "0.5"
sha2 = "0.10"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }

[dev-dependencies]
toml = "0.8"
tokio = { workspace = true, features = ["test-util"] }
