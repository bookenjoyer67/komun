# Module 4.2 eval-gated pipeline for the Komun Target Codebase.
#
# Five jobs, one per row of the lesson's governed-pipeline table (lesson 4.2, block [16]).
# The job keys are the lesson's: change-type-check, policy-gate, eval-gate, advisory-review,
# audit-trail.
#
# Which jobs may fail the build (lesson 4.2 block [53], VERBATIM): "A gating step runs, and if it
# fails, the pipeline stops and the merge is blocked until the failure is resolved. Use gating for
# steps with clear, repeatable pass/fail criteria, for harnesses that are stable and well-calibrated
# ... and for invariants the team has agreed must always hold, such as policy compliance." and
# "Every new agentic step should start as advisory, rather than gating. Deterministic checks can
# gate immediately because they produce the same result for the same input."
#
#   gating    change-type-check (fails only if it cannot classify), policy-gate, eval-gate
#   advisory  advisory-review (continue-on-error: true), audit-trail (continue-on-error: true)
#
# policy-gate carries no `continue-on-error` on purpose: lesson 4.2 block [101] (VERBATIM):
# "Leave continue-on-error at its default of false on the policy gate. That default is what makes a
# failing job actually fail". A required status check is what makes the gate bind (block [102]):
# "Until a check is required, it is advisory in effect no matter what your YAML says."
#
# Every claim in this file that needs a container is verified in the session log for this task;
# claims that need a real GitHub Actions run are listed at the end of docs/ci-step-design.md.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A push to the default branch is the other way code lands, and until this trigger existed the
  # last commits on main had never been seen by a workflow. Everything the push path cannot take
  # from the event -- the comparison base, the pull request number, the comment target -- is either
  # resolved below or guarded to the pull_request event.
  push:
    branches: [main]
  # A manual run builds the same production artifact and uploads it as a workflow artifact instead of
  # publishing a release, so the build can be exercised -- and the tarball tried on a host -- before the
  # first release exists.
  workflow_dispatch:

# Least privilege at the workflow level. A job asks for more only where a step uses it.
permissions:
  contents: read

# One run per pull request: two pushes in a row otherwise run two pipelines against the same
# head revision, both writing artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # Row 1 of the lesson's table: "Change Classifier | Which files changed | No | Every run | No |
  # Job outputs". Classifies deterministic work against agentic work and exports the lesson's two
  # flags. It never judges the diff, so it never blocks on what it finds; it fails only when it
  # cannot produce the classification the downstream gates key off, which is fail-closed.
  # ---------------------------------------------------------------------------------------------
  change-type-check:
    name: Change Classifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed-files: ${{ steps.classify.outputs.changed-files }}
      comparison-base: ${{ steps.base.outputs.comparison-base }}
      change-type: ${{ steps.classify.outputs.change-type }}
      requires-governed-check: ${{ steps.classify.outputs.requires-governed-check }}
      touches-policy: ${{ steps.classify.outputs.touches-policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The full history, so the base commit of the pull request is present and `git diff`
          # can compare the two revisions directly.
          fetch-depth: 0

      # GitHub only reports a bad pin when the job using it starts, and the release job runs only on
      # a push to the default branch -- so a typo in it is discovered during a publish. Measured here:
      # a rust-cache pin one character short failed the job with "unable to resolve action ... unable
      # to find version". Resolving each reference answers the real question (does this pin exist?)
      # rather than guessing from its shape: a tag and a full SHA both resolve, a truncated or
      # mistyped one does not.
      - name: Resolve every action pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(git ls-files | grep -E '(\.github/workflows/.*\.ya?ml|(^|/)action\.ya?ml)$')
          fail=0
          for f in $files; do
            for ref in $(grep -oE 'uses:[[:space:]]+[^[:space:]#]+' "$f" | sed 's/^uses:[[:space:]]*//'); do
              case "$ref" in
                ./*|../*|docker://*) continue ;;   # a local action or an image has nothing to resolve
              esac
              slug="${ref%@*}"
              pin="${ref##*@}"
              if ! gh api "repos/$slug/commits/$pin" --jq .sha >/dev/null 2>&1; then
                echo "::error file=$f::unresolvable action pin: $ref"
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] || { echo "at least one action reference does not resolve"; exit 1; }
          echo "every action reference resolves"

      # One place resolves the revision this run compares against: the pull request's base on a
      # pull_request event, the previous tip on a push. A push of a new branch, a force push or a
      # shallow clone can leave that commit absent, so the step falls back to the pushed commit's
      # parent and prints which revision it used. The value feeds the classifier's diff and the
      # conformance gate's comparison, so neither can silently compare a tree against itself.
      - name: Resolve the comparison base
        id: base
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$EVENT_BASE"
          reason=""
          case "$base" in
            ""|0000000000000000000000000000000000000000) base=""; reason="the event carried no base revision" ;;
          esac
          if [ -n "$base" ] && ! git -C "$GITHUB_WORKSPACE" cat-file -e "${base}^{commit}" 2>/dev/null; then
            reason="the event's base revision is not in this checkout"
            base=""
          fi
          if [ -z "$base" ]; then
            base="$(git -C "$GITHUB_WORKSPACE" rev-parse "HEAD^" 2>/dev/null || git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "comparison base falls back to $base ($reason)"
          else
            echo "comparison base is $base"
          fi
          echo "comparison-base=$base" >> "$GITHUB_OUTPUT"
          git -C "$GITHUB_WORKSPACE" cat-file -e "${base}^{commit}" || { echo "$base is not a commit in this checkout"; exit 1; }

      - name: Classify the pull request's changed files
        id: classify
        env:
          # The two revisions are trusted values from the event payload and are read from the
          # environment, not interpolated into the script (no shell re-parsing of event data).
          BASE_SHA: ${{ steps.base.outputs.comparison-base }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci-artifacts
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > ci-artifacts/changed-files.txt
          echo "changed files ($(wc -l < ci-artifacts/changed-files.txt)):"
          cat ci-artifacts/changed-files.txt
          # The classifier owns the rule; it writes the JSON the audit trail reads and appends
          # requires-governed-check and touches-policy to $GITHUB_OUTPUT.
          python3 scripts/classify-change.py \
            --out ci-artifacts/change-classification.json \
            --github-output \
            < ci-artifacts/changed-files.txt
          # The two remaining outputs are read back from the JSON the classifier wrote, so the
          # workflow never re-implements the rule.
          echo "changed-files=$(paste -sd' ' ci-artifacts/changed-files.txt)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("ci-artifacts/change-classification.json", encoding="utf-8"))
          print("change-type={}".format(data["change_type"]))
          PY

      - name: Upload the change classification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: change-classification
          path: |
            ci-artifacts/change-classification.json
            ci-artifacts/changed-files.txt
          retention-days: 90
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Row 2: "Policy Test Suite | Whether permissions match the governance policy | No | Every run |
  # Yes | Policy report". Gating. Runs the two suites the gate table's `policy` gate names
  # (`agentic.config.json` `toolchain.commands.policy.argv`), inside the sandbox image with the
  # workspace read-only, and uploads the JSON report with if: always().
  # ---------------------------------------------------------------------------------------------
  policy-gate:
    name: Policy Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: change-type-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Every repository-specific value this job needs is read from agentic.config.json through
      # scripts/agentic_config.py, each with this repository's current value as the fallback
      # default, so the job is unchanged when the loader or the config is absent. See PORTING.md.
      - name: Resolve the portability config
        run: |
          cfg() { local v; v="$(python3 scripts/agentic_config.py --get "$1" --default "$2" 2>/dev/null)" || v="$2"; [ -n "$v" ] || v="$2"; printf '%s' "$v"; }
          {
            echo "AGENT_IMAGE_BASE=$(cfg containers.base_image 'agent-sandbox:komun')"
            echo "AGENT_IMAGE_TOOLS=$(cfg containers.tools_image 'agent-sandbox:komun-m3')"
            echo "AGENT_WORKSPACE=$(cfg containers.workspace '/workspace')"
          } >> "$GITHUB_ENV"

      # Adaptation of the lesson's `docker build -t agentic_engineer_4 .` (block [93]). This
      # repository's equivalent of the course image is the two-image sandbox pair, and the second
      # build needs the first as its base (sandbox/Dockerfile.m3 `ARG BASE=agent-sandbox:komun`).
      - name: Build the sandbox image
        run: |
          docker build -t ${{ env.AGENT_IMAGE_BASE }} .
          docker build -f sandbox/Dockerfile.m3 -t ${{ env.AGENT_IMAGE_TOOLS }} .

      - name: Run policy tests
        run: |
          mkdir -p ci-artifacts
          docker run --rm \
            -v "$GITHUB_WORKSPACE":${{ env.AGENT_WORKSPACE }}:ro \
            -v "$GITHUB_WORKSPACE/ci-artifacts":/reports \
            -w ${{ env.AGENT_WORKSPACE }} \
            ${{ env.AGENT_IMAGE_TOOLS }} \
            python -m pytest eval/test_policy.py eval/test_deterministic_step.py -v \
              --json-report \
              --json-report-file=/reports/policy-report.json

      - name: Upload policy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: policy-report
          path: ci-artifacts/policy-report.json
          retention-days: 90
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Row 3a of the lesson's table, applied to the frontend: the two deterministic gates the
  # repository's own gate table already names (`agentic.config.json` `toolchain.commands.webcheck`
  # and `webtest`). They run on the runner rather than in the sandbox because `npm ci` and
  # `svelte-kit sync` must write `web/node_modules` and `web/.svelte-kit`, and the sandbox's
  # workspace mount is read-only. Gating: both are deterministic.
  # ---------------------------------------------------------------------------------------------
  web-gate:
    name: Web Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: change-type-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Every repository-specific value this job needs is read from agentic.config.json through
      # scripts/agentic_config.py, each with this repository's current value as the fallback default.
      - name: Resolve the portability config
        run: |
          cfg() { local v; v="$(python3 scripts/agentic_config.py --get "$1" --default "$2" 2>/dev/null)" || v="$2"; [ -n "$v" ] || v="$2"; printf '%s' "$v"; }
          {
            echo "AGENT_IMAGE_BASE=$(cfg containers.base_image 'agent-sandbox:komun')"
            echo "AGENT_IMAGE_TOOLS=$(cfg containers.tools_image 'agent-sandbox:komun-m3')"
            echo "AGENT_WORKSPACE=$(cfg containers.workspace '/workspace')"
            echo "AGENT_CACHE_TARGET=${RUNNER_TEMP}/$(cfg containers.cargo_target_cache 'cargo-target')"
            echo "AGENT_CACHE_REGISTRY=${RUNNER_TEMP}/$(cfg containers.cargo_registry_cache 'cargo-registry')"
          } >> "$GITHUB_ENV"

      # The tools image is this job's toolchain, and a jobs starts on a fresh runner with no local
      # image: without these two builds the wasm step fails with `pull access denied for
      # agent-sandbox` (measured on this branch's first run, job 111965569371).
      - name: Build the sandbox image
        run: |
          docker build -t ${{ env.AGENT_IMAGE_BASE }} .
          docker build -f sandbox/Dockerfile.m3 -t ${{ env.AGENT_IMAGE_TOOLS }} .

      # `web/package.json` depends on `komun-wasm: file:../crates/wasm/pkg`, and that package is a
      # gitignored build artifact (`docs/DEVELOPMENT.md:129` `wasm-pack build crates/wasm --target web`),
      # so a clean checkout cannot type-check without it. Measured without this step:
      # `svelte-check found 2 errors` -- "Cannot find module 'komun-wasm'". The build runs in the sandbox
      # image, which already carries the compiler and wasm-pack; the pkg directory is bind-mounted back
      # into the checkout so the runner's npm sees it (the same writable-bind trick the guards use).
      - name: Build the wasm package the frontend imports
        run: |
          mkdir -p crates/wasm/pkg "${{ env.AGENT_CACHE_TARGET }}" "${{ env.AGENT_CACHE_REGISTRY }}"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":${{ env.AGENT_WORKSPACE }}:ro \
            -v "$GITHUB_WORKSPACE/crates/wasm/pkg":${{ env.AGENT_WORKSPACE }}/crates/wasm/pkg \
            -v "${{ env.AGENT_CACHE_TARGET }}":/ci-target \
            -v "${{ env.AGENT_CACHE_REGISTRY }}":/usr/local/cargo/registry \
            -e CARGO_TARGET_DIR=/ci-target \
            -w ${{ env.AGENT_WORKSPACE }} \
            ${{ env.AGENT_IMAGE_TOOLS }} \
            wasm-pack build crates/wasm --target web

      # 22.23.2 is the version the sandbox image installs (`Dockerfile:15` ARG NODE_VERSION), so a
      # pass here and a pass in the sandbox mean the same thing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the frontend dependencies
        run: npm ci --prefix web --no-audit --no-fund

      # The workflow does not read a command out of agentic.config.json and execute it: that file is
      # pull-request controlled, so executing an argv from it would be a command-injection path on the
      # runner. It asserts the two commands still match the seam table instead, so a fork that changes
      # a gate's argv is told here rather than silently drifted.
      - name: Assert the commands still match the gate table
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          EXPECTED = {
              "webcheck": ["npm", "--prefix", "web", "run", "check"],
              "webtest": ["npm", "--prefix", "web", "run", "test"],
          }
          for gate, argv in EXPECTED.items():
              out = subprocess.run(
                  ["python3", "scripts/agentic_config.py", "--get", f"toolchain.commands.{gate}.argv"],
                  capture_output=True,
                  text=True,
                  check=True,
              ).stdout
              got = json.loads(out)
              assert got == argv, f"{gate}: the gate table says {got}, this workflow runs {argv}"
          print("the web gate argv matches agentic.config.json")
          PY

      - name: Type-check the frontend
        run: npm --prefix web run check

      - name: Unit-test the frontend
        run: npm --prefix web run test

  # ---------------------------------------------------------------------------------------------
  # The console crate's own gate, run from this workflow because `console/.github/workflows/ci.yml`
  # cannot execute here: GitHub reads workflows only from the repository root. The crate is
  # deliberately its own workspace root (`console/Cargo.toml`), so `cargo test --workspace` never
  # sees it either. Same three commands the crate's documentation tells a reader to run.
  # ---------------------------------------------------------------------------------------------
  console-gate:
    name: Console Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: change-type-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d  # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          workspaces: console

      - name: format
        run: cargo fmt --check
        working-directory: console

      - name: lint
        run: cargo clippy --release --all-targets -- -D warnings
        working-directory: console

      - name: tests
        run: cargo test --release
        working-directory: console

  # ---------------------------------------------------------------------------------------------
  # The database-backed suites the workspace gate reports as ignored. They cannot run in the sandbox
  # image: they need a live Postgres, and the image's route to one is exactly what an earlier probe
  # failed to find (the local test database publishes to 127.0.0.1 only). This job runs them where the
  # operator runs them -- on the host, against a disposable database -- with the command the suites'
  # own documentation gives (`crates/server/src/tests/key_coherence.rs` `KOMUN_TEST_DATABASE_URL=
  # postgres://... cargo test -p komun-server key_coherence -- --ignored`). Gating: deterministic.
  # ---------------------------------------------------------------------------------------------
  database-gate:
    name: Database Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: change-type-check
    services:
      # Disposable and reachable only on the runner's loopback. The password is a literal on purpose:
      # it protects nothing, it is destroyed with the container, and reading it from a secret would
      # imply it is worth keeping. It is never echoed: the URL is built into the env of one step.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: komun
          POSTGRES_PASSWORD: komun_test_only
          POSTGRES_DB: komun_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d  # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2

      # --test-threads=1 because every test in the crate shares this one database and each builds its
      # own harness and user; the suites' documentation says the same. --ignored selects exactly the
      # set the workspace gate reports as ignored, and nothing else.
      - name: Run the database suites
        env:
          KOMUN_TEST_DATABASE_URL: postgres://komun:komun_test_only@127.0.0.1:5432/komun_test
        run: cargo test -p komun-server -- --ignored --test-threads=1

  # ---------------------------------------------------------------------------------------------
  # Row 3: "Evaluation Harness | Whether agent behavior remains acceptable | Can run both
  # deterministic and agentic tests | Agent-affecting changes | Yes | Evaluation reports".
  # Gating, and it runs only when the classifier says the change can affect agent behaviour.
  # ---------------------------------------------------------------------------------------------
  eval-gate:
    name: Evaluation Harness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [change-type-check, policy-gate]
    if: needs.change-type-check.outputs.requires-governed-check == 'true'
    steps:
      # Full history, because the conformance gate reads the pull request's base commit out of this
      # checkout's object database (`git show <base>:<file>`), and the default depth-1 clone carries
      # only the merge commit. The base-presence step below makes a regression here fail loudly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Every repository-specific value this job needs is read from agentic.config.json through
      # scripts/agentic_config.py, each with this repository's current value as the fallback
      # default, so the job is unchanged when the loader or the config is absent. See PORTING.md.
      - name: Resolve the portability config
        run: |
          cfg() { local v; v="$(python3 scripts/agentic_config.py --get "$1" --default "$2" 2>/dev/null)" || v="$2"; [ -n "$v" ] || v="$2"; printf '%s' "$v"; }
          {
            echo "AGENT_IMAGE_BASE=$(cfg containers.base_image 'agent-sandbox:komun')"
            echo "AGENT_IMAGE_TOOLS=$(cfg containers.tools_image 'agent-sandbox:komun-m3')"
            echo "AGENT_WORKSPACE=$(cfg containers.workspace '/workspace')"
            echo "AGENT_CACHE_TARGET=${RUNNER_TEMP}/$(cfg containers.cargo_target_cache 'cargo-target')"
            echo "AGENT_CACHE_REGISTRY=${RUNNER_TEMP}/$(cfg containers.cargo_registry_cache 'cargo-registry')"
          } >> "$GITHUB_ENV"

      - name: Build the sandbox image
        run: |
          docker build -t ${{ env.AGENT_IMAGE_BASE }} .
          docker build -f sandbox/Dockerfile.m3 -t ${{ env.AGENT_IMAGE_TOOLS }} .

      # The compiler caches live outside the checkout, because the checkout is mounted read-only
      # apart from the two files the guards touch, which are writable binds like these caches.
      - name: Restore the cargo caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ env.AGENT_CACHE_TARGET }}
            ${{ env.AGENT_CACHE_REGISTRY }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The conformance gate compares the working tree against the pull request's base revision,
      # so a missing base object would leave it comparing the tree against itself and passing.
      - name: Verify the pull request's base revision is present
        env:
          BASE_SHA: ${{ needs.change-type-check.outputs.comparison-base }}
        run: |
          git -C "$GITHUB_WORKSPACE" cat-file -e "${BASE_SHA}^{commit}" \
            || { echo "the base commit ${BASE_SHA} is not in this checkout"; exit 1; }

      - name: Run the deterministic gates through the gate server
        run: |
          mkdir -p ci-artifacts "${{ env.AGENT_CACHE_TARGET }}" "${{ env.AGENT_CACHE_REGISTRY }}"
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE":${{ env.AGENT_WORKSPACE }}:ro \
            -v "$GITHUB_WORKSPACE/crates/server/src/main.rs":${{ env.AGENT_WORKSPACE }}/crates/server/src/main.rs \
            -v "$GITHUB_WORKSPACE/crates/core/src/tests.rs":${{ env.AGENT_WORKSPACE }}/crates/core/src/tests.rs \
            -v "$GITHUB_WORKSPACE/ci-artifacts":/reports \
            -v "${{ env.AGENT_CACHE_TARGET }}":/ci-target \
            -v "${{ env.AGENT_CACHE_REGISTRY }}":/usr/local/cargo/registry \
            -e CARGO_TARGET_DIR=/ci-target \
            -e GATE_WORKSPACE=${{ env.AGENT_WORKSPACE }} \
            -e GATE_AUDIT_PATH=/reports/gate-audit.log \
            -e CONFORMANCE_BASE_REF=${{ needs.change-type-check.outputs.comparison-base }} \
            -w ${{ env.AGENT_WORKSPACE }} \
            ${{ env.AGENT_IMAGE_TOOLS }} python3 - <<'PY'
          """Run the gate server's four allowlisted gates and write one report.

          The argv, each gate's cache-hit guard and the conformance gate's base revision are the
          server's own (BASE_ENV, passed in through the environment): this script loads
          mcp/gate/server.py and calls its run_gate() tool, so nothing is re-typed here. run_gate
          journals one line per executed gate to GATE_AUDIT_PATH.
          """
          import importlib.util
          import json
          import pathlib
          import sys

          spec = importlib.util.spec_from_file_location("komun_gate", "${{ env.AGENT_WORKSPACE }}/mcp/gate/server.py")
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)

          reports = pathlib.Path("/reports")
          reports.mkdir(parents=True, exist_ok=True)
          # The counts are nested under "summary" because that is the shape the audit trail reads
          # (scripts/build-audit-trail.py, harness_summary()).
          counts = {"passed": 0, "failed": 0, "total": 0}
          gates = {}
          for name in ("test", "clippy", "fmt", "conformance"):
              result = gate.run_gate(name, "ci", 1800)
              gates[name] = {
                  "argv": result["argv"],
                  "exit_code": result["exit_code"],
                  "passed": result["passed"],
                  "verdict": result["verdict"],
                  "guard": result["guard"],
                  "duration_seconds": result["duration_seconds"],
                  "stdout_tail": result["stdout"][-4000:],
                  "stderr_tail": result["stderr"][-4000:],
              }
              print(
                  "GATE {} argv={} exit={} passed={} guard_applied={} guard_satisfied={} verdict={}".format(
                      name, result["argv"], result["exit_code"], result["passed"],
                      result["guard"]["applied"], result["guard"]["satisfied"], result["verdict"],
                  ),
                  flush=True,
              )
              if name == "fmt":
                  # Repo-wide formatting is recorded, never tallied. This tree carries pre-existing
                  # rustfmt drift (docs/iteration-log.md Run 005 records 213 hunks across 35 files),
                  # so a repo-wide fmt verdict would fail every pull request for reasons the change
                  # did not cause. The scoped step that follows is the fmt gate.
                  counts["fmt_recorded_only"] = counts.get("fmt_recorded_only", 0) + 1
                  continue
              counts["total"] += 1
              counts["passed" if result["passed"] else "failed"] += 1
          (reports / "deterministic-report.json").write_text(
              json.dumps({"summary": counts, "gates": gates}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("DETERMINISTIC_RESULT passed={passed} failed={failed} total={total}".format(**counts), flush=True)
          sys.exit(0 if counts["failed"] == 0 else 1)
          PY

      - name: Check out the base revision for comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.change-type-check.outputs.comparison-base }}
          path: base
          fetch-depth: 0

      - name: Format check scoped to the changed files
        # Gating, and it gates the change rather than the repository's legacy state. This tree carries
        # pre-existing rustfmt drift (docs/iteration-log.md Run 005 records 213 hunks across 35 files),
        # so a repo-wide fmt gate would fail every pull request for reasons the change did not cause.
        # This step compares each changed Rust file against the same file at the base revision and
        # fails only when the change makes formatting worse or adds an unformatted file.
        run: |
          mkdir -p ci-artifacts
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE":${{ env.AGENT_WORKSPACE }}:ro \
            -v "$GITHUB_WORKSPACE/base":/base:ro \
            -v "$GITHUB_WORKSPACE/ci-artifacts":/reports \
            -w ${{ env.AGENT_WORKSPACE }} \
            -e CHANGED_FILES="${{ needs.change-type-check.outputs.changed-files }}" \
            -e BASE_DIR=/base \
            ${{ env.AGENT_IMAGE_TOOLS }} python3 - <<'PY'
          """Fail only on new rustfmt drift, judged against the base revision.

          A repo-wide fmt verdict is not usable as a merge gate on this repository: the tree carries
          pre-existing drift, so the gate would fail every pull request for reasons the change did not
          cause. For each changed Rust file this step compares the file's formatting state now with its
          state at the base revision, and it fails in exactly two cases: a file that was formatted at
          base and is unformatted now, and a file new in this change that is unformatted. Skips print
          their reason, because a check that cannot fail is not evidence of anything.
          """
          import os
          import pathlib
          import re
          import subprocess
          import sys


          def unformatted(path):
              """True when rustfmt would rewrite this file, judged on its real content."""
              source = pathlib.Path(path).read_text(encoding="utf-8")
              proc = subprocess.run(
                  ["rustfmt", "--emit", "stdout", "--edition", EDITION],
                  input=source,
                  cwd="${{ env.AGENT_WORKSPACE }}",
                  capture_output=True,
                  text=True,
                  timeout=300,
              )
              if proc.returncode != 0:
                  return None, proc.stderr.strip()[:400]
              return proc.stdout != source, ""


          raw = os.environ.get("CHANGED_FILES", "").replace(",", " ")
          changed = [p for p in raw.split() if p.strip()]
          rust = sorted({p for p in changed if p.endswith(".rs")})
          manifest = pathlib.Path("${{ env.AGENT_WORKSPACE }}/Cargo.toml").read_text(encoding="utf-8")
          match = re.search(r'^edition\s*=\s*"([0-9]+)"', manifest, re.M)
          EDITION = match.group(1) if match else "2021"
          base_dir = pathlib.Path(os.environ.get("BASE_DIR", "/base"))
          print(
              "SCOPED_FMT changed_files={} rust_files={} edition={} base={}".format(
                  len(changed), len(rust), EDITION, base_dir
              ),
              flush=True,
          )
          if not rust:
              print("SCOPED_FMT result=skip reason=no-rust-file-in-this-change", flush=True)
              sys.exit(0)
          report = pathlib.Path("/reports/fmt-scope.txt")
          regressions, new_unformatted, carried, errors = [], [], [], []
          for path in rust:
              here = pathlib.Path("${{ env.AGENT_WORKSPACE }}", path)
              there = base_dir / path
              if not here.exists():
                  print("SCOPED_FMT file={} result=skip-file-absent".format(path), flush=True)
                  continue
              now_bad, now_err = unformatted(here)
              if now_bad is None:
                  errors.append((path, now_err))
                  print("SCOPED_FMT file={} result=error {}".format(path, now_err), flush=True)
                  continue
              if not there.exists():
                  if now_bad:
                      new_unformatted.append(path)
                      verdict = "fail-new-file-unformatted"
                  else:
                      verdict = "pass-new-file"
              else:
                  base_bad, base_err = unformatted(there)
                  if base_bad is None:
                      errors.append((path, base_err))
                      print("SCOPED_FMT file={} result=error-at-base {}".format(path, base_err), flush=True)
                      continue
                  if now_bad and not base_bad:
                      regressions.append(path)
                      verdict = "fail-new-drift"
                  elif now_bad and base_bad:
                      carried.append(path)
                      verdict = "pass-drift-carried-from-base"
                  else:
                      verdict = "pass"
              with report.open("a", encoding="utf-8") as handle:
                  handle.write("{} {}\n".format(path, verdict))
              print("SCOPED_FMT file={} result={}".format(path, verdict), flush=True)
          print(
              "SCOPED_FMT summary regressions={} new_unformatted={} carried={} errors={}".format(
                  len(regressions), len(new_unformatted), len(carried), len(errors)
              ),
              flush=True,
          )
          failed = bool(regressions or new_unformatted or errors)
          print("SCOPED_FMT result={}".format("fail" if failed else "pass"), flush=True)
          sys.exit(1 if failed else 0)
          PY

      - name: Run the retrieval ground-truth harness
        # always(): a red deterministic gate must not hide the harness evidence.
        if: always()
        run: |
          mkdir -p ci-artifacts
          docker run --rm \
            -v "$GITHUB_WORKSPACE":${{ env.AGENT_WORKSPACE }}:ro \
            -v "$GITHUB_WORKSPACE/ci-artifacts":/reports \
            -e RETRIEVAL_EMBEDDING_MODEL=BAAI/bge-small-en-v1.5 \
            -e RETRIEVAL_QUERY_PREFIX='Represent this sentence for searching relevant passages: ' \
            -e RETRIEVAL_AUDIT_PATH=/reports/retrieval-audit.log \
            -w ${{ env.AGENT_WORKSPACE }} \
            ${{ env.AGENT_IMAGE_TOOLS }} \
            bash -c '
              python3 mcp/retrieval/server.py --port 8002 --host 127.0.0.1 \
                --audit-path /reports/retrieval-audit.log > /reports/retrieval-server.log 2>&1 &
              server_pid=$!
              for attempt in $(seq 1 150); do
                grep -q "^indexed " /reports/retrieval-server.log 2>/dev/null && break
                kill -0 "$server_pid" 2>/dev/null || break
                sleep 1
              done
              grep -m1 "^indexed " /reports/retrieval-server.log
              status=0
              python3 mcp/retrieval/run_ground_truth.py --server http://127.0.0.1:8002/mcp \
                > /reports/retrieval-ground-truth.log 2>&1 || status=$?
              kill "$server_pid" 2>/dev/null || true
              cat /reports/retrieval-ground-truth.log
              exit "$status"
            '

      - name: Write the retrieval report the audit trail consumes
        # Advisory support step: it turns the harness log into JSON evidence. The 80 percent floor
        # is enforced by the harness above, whose exit status is the gate.
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re

          log = pathlib.Path("ci-artifacts/retrieval-ground-truth.log")
          text = log.read_text(encoding="utf-8", errors="replace") if log.is_file() else ""
          match = re.search(
              r"^HARNESS_RESULT passed=(\d+) total=(\d+) rate=([\d.]+) floor=([\d.]+)", text, re.M
          )
          if match:
              passed, total, rate, floor = (
                  int(match.group(1)), int(match.group(2)), float(match.group(3)), float(match.group(4))
              )
          else:
              passed, total, rate, floor = 0, 0, 0.0, 80.0
          report = {
              "summary": {"passed": passed, "failed": total - passed, "total": total},
              "pass_rate": rate,
              "floor": floor,
              "retrieval_method_model": "BAAI/bge-small-en-v1.5",
              "harness_result": match.group(0) if match else None,
              "log": "retrieval-ground-truth.log",
          }
          pathlib.Path("ci-artifacts/retrieval-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(report["summary"]))
          PY

      - name: Upload the deterministic gate reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: deterministic-report
          path: |
            ci-artifacts/deterministic-report.json
            ci-artifacts/gate-audit.log
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload the retrieval harness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: retrieval-report
          path: |
            ci-artifacts/retrieval-report.json
            ci-artifacts/retrieval-ground-truth.log
            ci-artifacts/retrieval-audit.log
            ci-artifacts/retrieval-server.log
          retention-days: 90
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Row 5: "Advisory Code Review | Reviews changed code and provides feedback | Yes | Relevant
  # pull requests | No | Pull request comment". Advisory by construction: the job is marked
  # continue-on-error, and the step that runs the reviewer captures its exit status and exits 0.
  # ---------------------------------------------------------------------------------------------
  advisory-review:
    name: Advisory Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [change-type-check, policy-gate]
    # Lesson 4.2 acceptance, block [150]: "continue-on-error: true is set on the advisory-review
    # job". This is what makes a non-zero exit from any step in this job unable to fail the build.
    continue-on-error: true
    permissions:
      contents: read
      # Used by one step only: the one that posts the review summary as a pull request comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run the advisory reviewer
        env:
          # Secret rule 3 (lesson 4.2 block [72], VERBATIM): "Scoped to the step: Inject a secret
          # only into the steps that actually use it, not onto the whole job." This step reads one
          # secret, OPENROUTER_API_KEY, and scripts/run-reviewer.py reads that one name only.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # The classifier's file list, passed through the environment rather than interpolated
          # into the script, so a file name cannot become a shell token.
          CHANGED_FILES: ${{ needs.change-type-check.outputs.changed-files }}
        run: |
          mkdir -p ci-artifacts
          set +e
          printf '%s\n' $CHANGED_FILES | python3 scripts/run-reviewer.py \
            --repo "$GITHUB_WORKSPACE" \
            --out-dir ci-artifacts 2>&1 | tee ci-artifacts/review-output.txt
          status="${PIPESTATUS[0]}"
          echo "run-reviewer.py exit status: $status (advisory: severity never fails this job)"
          exit 0

      - name: Post the review summary as a pull request comment
        # The one consumer of `pull-requests: write`. Advisory: a comment that cannot be posted
        # (for example on a fork pull request, where GITHUB_TOKEN is read-only) is reported and
        # ignored rather than failing anything. A push has no pull request to comment on.
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -s ci-artifacts/review-summary.md ]; then
            echo "no review summary was produced; nothing to post"
            exit 0
          fi
          gh pr comment "$PULL_REQUEST_NUMBER" --body-file ci-artifacts/review-summary.md \
            || echo "the review comment could not be posted (advisory, ignored)"

      - name: Upload the review report and its audit log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: advisory-review-report
          path: |
            ci-artifacts/review-report.json
            ci-artifacts/review-summary.md
            ci-artifacts/audit-review.log
            ci-artifacts/review-output.txt
          retention-days: 90
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Row 6: "Audit Trail | Combines evidence from the other jobs | No | After the other jobs | No |
  # Combined artifact". needs: [...] with if: always() is, in the lesson's words (block [162]),
  # "the whole point of a separate final job"; and the trail "does not decide whether code can
  # merge". continue-on-error makes that structural on the job.
  # ---------------------------------------------------------------------------------------------
  audit-trail:
    name: Audit Trail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every gating job, so the trail is assembled from a finished run. Its three recorded result
    # keys are the lesson table's, not an inventory of the jobs: web-gate and console-gate upload no
    # artifact, and their verdicts are read from the run itself.
    needs: [change-type-check, policy-gate, web-gate, console-gate, database-gate, eval-gate, advisory-review]
    if: always()
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Lesson 4.2 acceptance, block [169]: "actions/download-artifact@v4 is used with
      # merge-multiple: true to flatten all artifacts into one directory".
      - name: Download every earlier artifact into one directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: ci-artifacts
          merge-multiple: true

      - name: Build the audit trail
        env:
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          POLICY_GATE_RESULT: ${{ needs.policy-gate.result }}
          EVAL_GATE_RESULT: ${{ needs.eval-gate.result }}
          ADVISORY_REVIEW_RESULT: ${{ needs.advisory-review.result }}
        run: |
          python3 scripts/build-audit-trail.py \
            --artifacts-dir ci-artifacts \
            --sha "$SHA" \
            --head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --event "$EVENT" \
            --pull-request "$PULL_REQUEST_NUMBER" \
            --policy-gate "$POLICY_GATE_RESULT" \
            --governed-file-gate "$EVAL_GATE_RESULT" \
            --advisory-review "$ADVISORY_REVIEW_RESULT"

      - name: Upload the audit trail
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: audit-trail
          path: ci-artifacts/audit-trail.json
          retention-days: 90
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # The production artifact. It runs only for a push to the default branch, and only when every gating
  # job has passed, so the host that pulls it can only ever run a revision this pipeline verified. The
  # host pulls on a timer and has no inbound port for this; nothing here reaches the host.
  #
  # The binary is built inside an Alpine image rather than cross-compiled, because production is Alpine:
  # the same libc, and no OpenSSL in the toolchain (every TLS dependency here is rustls). The SPA carries
  # one inline bootstrap script whose sha256 the served policy pins, so the policy is generated for this
  # build by scripts/csp-hash.sh and shipped in the same tarball.
  # ---------------------------------------------------------------------------------------------
  release:
    name: Production Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [change-type-check, policy-gate, web-gate, console-gate, database-gate, eval-gate]
    # always(), because a skipped eval gate is a legitimate shape (a change that touches nothing
    # governed) and must not silence the release. Each gating job's result is checked explicitly.
    if: |
      always()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.event_name != 'push' || github.ref == 'refs/heads/main')
      && needs.change-type-check.result == 'success'
      && needs.policy-gate.result == 'success'
      && needs.web-gate.result == 'success'
      && needs.console-gate.result == 'success'
      && needs.database-gate.result == 'success'
      && (needs.eval-gate.result == 'success' || needs.eval-gate.result == 'skipped')
    permissions:
      contents: write   # one step creates the release; every other step only reads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d  # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install wasm-pack
        env:
          # Mirrors `Dockerfile` ARG WASM_PACK_VERSION, so the artifact is built by the tool the image
          # carries rather than whatever the installer script downloads today.
          WASM_PACK_VERSION: 0.15.0
        run: |
          curl -fsSL "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"             -o /tmp/wasm-pack.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          install -m 0755 "/tmp/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Build the wasm package and the frontend
        env:
          # The SPA's only build-time variable. Unset, the source's development fallback is baked
          # into the bundle (`web/src/lib/stores/directories.ts:4` `import.meta.env
          # .VITE_DEFAULT_DIRECTORY || 'http://localhost:3001'`), so every visitor's
          # server-discovery call goes to their own machine -- and the served policy
          # (`connect-src 'self'`) blocks it, so the failure is silent in the console. Measured: a
          # build with no environment carries `localhost:` in its directories chunk.
          # Same origin on purpose: a cross-origin value would also have to be added to connect-src.
          VITE_DEFAULT_DIRECTORY: https://komun.buzz
        run: |
          wasm-pack build crates/wasm --target web
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
          grep -rho 'https://komun.buzz' web/build | head -1

      # A bundle with a development fallback is a broken deploy that looks like a green one.
      - name: Refuse to ship a development fallback
        run: |
          if grep -rl 'localhost:' web/build >/dev/null; then
            echo 'the built bundle carries a development fallback:'
            grep -rl 'localhost:' web/build | head -5
            exit 1
          fi
          echo 'no development fallback in the bundle'

      - name: Build the server for an Alpine host
        run: |
          mkdir -p "$RUNNER_TEMP/musl-target"
          docker run --rm             -v "$GITHUB_WORKSPACE":/src             -v "$RUNNER_TEMP/musl-target":/target             -e CARGO_TARGET_DIR=/target             -e SQLX_OFFLINE=true             -w /src             rust:1.95-alpine             sh -c 'apk add --no-cache musl-dev >/dev/null && cargo build --release --bin komun-server'
          file "$RUNNER_TEMP/musl-target/release/komun-server"

      - name: Generate the policy for this build
        run: scripts/csp-hash.sh web/build/index.html > deploy/csp.conf
        # The hash pins this build's inline bootstrap script; an old policy under a new frontend is a
        # blank page for every visitor, with nothing in the server log to say why.

      - name: Assemble the tarball
        run: |
          rm -rf staging
          mkdir -p staging
          install -m 0755 "$RUNNER_TEMP/musl-target/release/komun-server" staging/komun-server
          cp -a web/build staging/frontend
          install -m 0644 deploy/csp.conf staging/csp.conf
          printf '%s\n' "$GITHUB_SHA" > staging/VERSION
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > staging/BUILD
          tar -czf "$RUNNER_TEMP/komun-prod.tar.gz" -C staging .
          ( cd "$RUNNER_TEMP" && sha256sum komun-prod.tar.gz > SHA256SUMS )
          ls -l "$RUNNER_TEMP/komun-prod.tar.gz" && cat staging/VERSION

      - name: Upload the artifact for a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: komun-prod
          path: |
            ${{ runner.temp }}/komun-prod.tar.gz
            ${{ runner.temp }}/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

      - name: Publish the release the host pulls
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          short="$(printf '%s' "$SHA" | cut -c1-7)"
          tag="prod-${short}-r${GITHUB_RUN_NUMBER}"
          gh release create "$tag"             --title "production ${short}"             --latest             --notes "Built and published by the pipeline from ${SHA}, after every gating job passed. The production host pulls the newest release on a timer; see docs/DEPLOY.md.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"             "$RUNNER_TEMP/komun-prod.tar.gz#komun-prod.tar.gz"             "$RUNNER_TEMP/SHA256SUMS#SHA256SUMS"
          gh release view "$tag" --json tagName,isLatest,assets \
            -q '{tag: .tagName, latest: .isLatest, assets: [.assets[].name]}'
