# Komun node configuration
# Copy this file to config.toml and edit it for your deployment.
# Environment variables override values in this file (see docs/DEVELOPMENT.md).

[server]
# Address and port the HTTP server listens on.
bind_address = "0.0.0.0"
port = 3000

[database]
# PostgreSQL connection string.
url = "postgres://komun:komun@localhost:5432/komun"
# Maximum size of the connection pool.
max_connections = 20

[node]
# This server's identity — how users and the public directory see it.
name = "My Community"
description = "Local listings for our neighborhood"
# Public base URL of this node. Used for emailed links and the advertised domain.
# public_url = "https://komun.example.org"
# Optional location, shown in the directory and used as the default map centre.
# location_name = "East Oakland, CA"
# location_lat = 37.77
# location_lon = -122.22

[discovery]
# Whether this server appears in the public server directory.
listed = false
# Directory service to register with. Only needed when `listed = true`.
# directory_url = "https://komun.buzz"
# Whether THIS server acts as a directory for other servers. When false the
# `/api/directory*` routes are not mounted at all and therefore return 404.
directory_enabled = false
# Whether this server advertises itself as openly registerable, and whether it
# accepts peer registrations into its directory. An explicit value wins; when
# omitted it follows `[registration] mode` (open => advertised). It is
# deliberately separate from user signup: a server may be invite-only for users
# and still accept peers.
# open_registration = true

[auth]
# How long a login session stays valid without being renewed, in days.
token_lifetime_days = 30
# Spam limit: maximum new account registrations per hour.
max_registrations_per_hour = 20

[security]
# Per-user hourly rate limits.
max_posts_per_hour = 60
max_messages_per_hour = 200
max_matches_per_hour = 30
# CORS allowed origins; "*" allows any origin.
allowed_origins = "*"
# Reverse proxies whose X-Forwarded-For header may be believed, as IP literals.
# Leave empty unless this server runs behind a trusted proxy: an unlisted peer's
# header is ignored entirely, which is the safe default.
# trusted_proxies = ["127.0.0.1"]

[posts]
# Default time-to-live for posts of each kind, in days (0 = never expires).
default_ttl_need_days = 7
default_ttl_offer_days = 14
default_ttl_resource_days = 0

[admin]
# Public keys of the initial superadmins, if any. Prefer promoting users with the
# CLI instead: komun-server admin add-superadmin <pubkey>
# superadmin_keys = []

[media]
# Where uploaded media is stored, and the size/count limits enforced on it.
avatar_dir = "data/avatars"
max_avatar_bytes = 1048576
post_images_dir = "data/post-images"
max_post_image_bytes = 5242880
max_post_images = 5

[email]
# SMTP used for address-verification and password-reset mail. Required only when
# `[registration] require_email_verification = true`: the server refuses to
# start if verification is on and this section has no `smtp_host` and `from`.
# Leave the section empty (as shipped) to run without mail.
# smtp_host = "smtp.example.org"
# smtp_port = 587          # defaults to 587 when omitted
# username = "komun@example.org"
# password = "change-me"
# from = "Komun <noreply@example.org>"
# starttls = true          # defaults to false
# public_url = "https://komun.example.org"   # link base; falls back to [node] public_url

[registration]
# Who may create an account: "open", "invite" or "closed".
mode = "open"
# Require users to confirm their email address before they can post. Set to
# `false` to run without SMTP; set it to `true` only when [email] `smtp_host`
# and `from` are configured, or the server refuses to start.
require_email_verification = false
# Minimum accepted password length.
min_password_length = 12

[geocode]
# Contact (email or URL) for this deployment, sent to Nominatim in the
# User-Agent header. Nominatim's usage policy requires a real contact, and
# requests may be blocked without one.
# contact = "admin@example.org"

[market]
# Server-wide marketplace defaults. Everything here is optional.
#
# Fallback currency for a marketplace post (`listing` / `want`) that arrives
# without one of its own, as an ISO-4217 alphabetic code: exactly three uppercase
# letters. The post's own `currency` always wins; this is consulted only when it
# has none, and with neither the post keeps no currency (which is allowed) — but
# an offer or an accept that names an amount is then refused with a 400 naming
# the missing currency.
#
# At negotiation time the rule is stricter, because a deal needs a unit: an offer
# that names its own `currency` uses it, even when that differs from the post's,
# and that currency is what the deal records when the offer is accepted. An
# `accept` must restate `amount_cents`. So the precedence is the offer's own
# currency, then the post's (which may itself be this value), then a 400.
#
# Unset by default, and left commented out deliberately — there is no currency
# that is right for a server that has not chosen one, and a value here would
# price every listing on this node in a unit nobody picked. A malformed value is
# a startup failure naming this key, the value and the remedy, not a surprise on
# the first listing.
# default_currency = "USD"
